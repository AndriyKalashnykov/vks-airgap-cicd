apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${APP_NAME}
  namespace: ${ARGOCD_NAMESPACE}
  labels:
    # ⚠️ THE STAMP `make uninstall-all` DELETES BY, AND IT IS LOAD-BEARING FOR SAFETY, NOT TIDINESS.
    # APP_NAME comes from apps/registry.tsv and is a generic demo name (javawebapp / gowebapp).
    # ARGOCD_NAMESPACE on a real lab is a SHARED namespace — measured on one 9.1 lab, it is the same
    # namespace as VKS_NAMESPACE and already contained a foreign Application plus another tool's
    # cluster Secret. Combine a generic name with the finalizer + prune:true below and a
    # delete-by-name teardown would CASCADE-DELETE ANOTHER TENANT'S RUNNING WORKLOADS. So teardown
    # selects on this label and refuses anything that lacks it.
    #
    # Namespaced to THIS repo deliberately: `app.kubernetes.io/managed-by` collides with everything,
    # and the shared lab already carries `nested-lab.local/managed-by` from a different tool.
    vks-airgap-cicd.local/owned-by: vks-airgap-cicd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # `default` permits every destination and repo — right for KinD and for the operator who INSTALLED
  # ArgoCD. A TENANT is given their own AppProject, and an Application whose project does not permit
  # its destination/repo is REJECTED. So this is a variable, not a literal.
  project: ${ARGOCD_PROJECT}
  source:
    # The Gitea URL ARGOCD'S repo-server can clone (GITEA_ARGOCD_URL — Gitea's LoadBalancer when
    # ArgoCD is off-cluster; the in-cluster Service DNS when it is not). NOT the ingress hostname:
    # that resolves only in the operator's /etc/hosts. Kustomize app at root.
    repoURL: ${DEPLOY_REPO_CLONE_URL}
    targetRevision: ${ARGOCD_TRACK_BRANCH}
    path: .
  destination:
    # Rendered as EITHER `server: <api-url>` OR `name: <registered cluster name>` — ArgoCD accepts
    # both, and a TENANT often has only the name: the cluster Secrets live in the ArgoCD admin's
    # namespace, which they may not list. In-cluster by default (KinD / ArgoCD-in-guest); on a real
    # lab the guest must be a REGISTERED destination or ArgoCD would deploy onto the Supervisor.
    ${ARGOCD_DEST_KEY}: ${ARGOCD_DEST_VALUE}
    namespace: ${APP_NAMESPACE}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
