# k8s/vks/cluster.yaml — the guest VKS cluster scenario-1 §4b provisions.
#
# WHY THIS FILE EXISTS: .env.example has documented VKS_CLUSTERCLASS / VKS_K8S_VERSION /
# VKS_VM_CLASS / VKS_STORAGE_CLASS / VKS_CONTROL_PLANE_COUNT / VKS_NODE_COUNT since the runbook was
# written, with the note "DOCUMENTED BUT NOT YET READ by any script (measured: 0 readers each)".
# This template + scripts/25-vks-cluster-create.sh are their first reader.
#
# ⚠️ BLOCK STYLE ONLY — NEVER a flow mapping. `${VAR}` inside `{ }` is a YAML syntax error (the `{`
# of `${` opens a nested flow map), so the file could not even be linted, let alone rendered.
#
# ⚠️ EVERY FIELD HERE IS ONE AN OPERATOR AUTHORS. The live lab-gc1 object carries a further ~20
# controller-set fields — spec.controlPlaneRef / infrastructureRef / controlPlaneEndpoint, the
# topology.cluster.x-k8s.io/owned + run.tanzu.vmware.com/tkr labels, the resolved-kr-data and
# tkr-spec annotations, finalizers, uid — and copying any of them from a running cluster is wrong:
# they name THAT cluster's random suffixes. Mirror what was APPLIED, never what is STORED.
#
# ⚠️ topology.variables.kubernetes is DELIBERATELY ABSENT. MEASURED via a server-side dry-run: the
# admission webhook DEFAULTS it (a manifest that never contained it came back carrying
# certificateRotation). Setting it here would be declaring a value we do not own.
#
# ⚠️ spec.topology.version is a PREFIX SELECTOR, not an exact version, and admission REWRITES it.
# MEASURED, 4 operating points: `v1.32.10+vmware.1-fips-vkr.2` and `v1.32.10+vmware.1-fips` and even
# a bare `v1.32` are all ACCEPTED and all store as `v1.32.10+vmware.1-fips`; only a version no TKr
# matches (`v1.99.99+...`) is denied, and the denial names the mechanism: `k8sVersionPrefix`.
# CONSEQUENCES: (a) do NOT gate on exact membership of the Ready+Compatible TKr list — the value in
# .env is admissible and is NOT in that list; (b) do NOT use a bare prefix in an air-gap repo, it
# FLOATS to the newest matching patch; (c) the ground truth for "which TKr am I on" is the
# run.tanzu.vmware.com/tkr LABEL on the created object, never spec.topology.version.
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${VKS_CLUSTER_NAME}
  namespace: ${VKS_NAMESPACE}
  labels:
    # The ownership stamp uninstall-all keys on. Namespaced to THIS repo on purpose: the shared lab
    # already carries a different tool's `nested-lab.local/managed-by`, and `app.kubernetes.io/
    # managed-by` is far too collidable to authorise a delete.
    vks-airgap-cicd.local/owned-by: vks-airgap-cicd
spec:
  clusterNetwork:
    services:
      cidrBlocks:
        - ${VKS_SERVICE_CIDR}
    pods:
      cidrBlocks:
        - ${VKS_POD_CIDR}
  topology:
    classRef:
      name: ${VKS_CLUSTERCLASS}
      namespace: ${VKS_CLUSTERCLASS_NAMESPACE}
    version: ${VKS_K8S_VERSION}
    controlPlane:
      replicas: ${VKS_CONTROL_PLANE_COUNT}
    workers:
      machineDeployments:
        - name: np1
          class: node-pool
          replicas: ${VKS_NODE_COUNT}
    variables:
      - name: vmClass
        value: ${VKS_VM_CLASS}
      - name: storageClass
        value: ${VKS_STORAGE_CLASS}
      - name: vsphereOptions
        value:
          persistentVolumes:
            defaultStorageClass: ${VKS_STORAGE_CLASS}
      # ---- node ephemeral storage ---
      # ⚠️ THIS IS A PLATFORM-ADMIN ACT, NOT A TENANT ONE. Editing spec.topology.variables on the
      # Cluster object requires ownership of it. In this repo's DEFAULT posture (RULE ZERO-B: a
      # tenant with .env and a guest kubeconfig) this is something you REQUEST, not something you
      # apply. It takes effect on the NEXT cluster creation; on an existing cluster the Tanzu
      # Cluster Operator rolls the nodes to apply it.----------------------------------------------------------
      # WHY. VKS node images ship a STATIC 20 GiB root partition (Broadcom KB 408602, which lists
      # "Nodes report DiskPressure" and "Pods are evicted due to insufficient ephemeral storage" as
      # its symptoms). Measured on this lab: capacity reads 19.3 GiB on every node. Our SIX builder
      # images alone are 4.44 GiB (rust 1.57, go 1.00, dotnet 0.97, java 0.62, nodejs 0.18,
      # python 0.11) before Kaniko, six app runtimes, Tekton, Istio and six builds' writable layers.
      #
      # The kubelet evicts below 15% free of imagefs -- ~2.9 GiB on a 20 GiB disk -- and
      # imageGCHighThresholdPercent defaults to 85, i.e. GC only starts at 15% free TOO. On a
      # single-filesystem node that is ZERO headroom: routine GC can never pre-empt the condition.
      #
      # WHAT IT COSTS WHEN IT FIRES (measured on this lab 2026-08-25, then REPRODUCED in a
      # throwaway 3-node KinD cluster): the node gets a NoSchedule taint, Tekton's affinity
      # assistant has already pinned the PipelineRun's pods to that node, and the next task cannot
      # move -- "Preemption is not helpful for scheduling", because BOTH filter failures return
      # UnschedulableAndUnresolvable and preemption can neither remove a taint nor create the pod a
      # required podAffinity needs. Tekton's own recovery does NOT rescue it: measured across three
      # arms (plain taint / cordon / forced PipelineRun reconcile) the assistant was never deleted.
      # Removing the taint scheduled the pod in under 5 seconds, so the stall lasts exactly as long
      # as the taint does.
      #
      # ⚠️ HOW LONG THAT IS, IS NOT ESTABLISHED -- and the obvious answer is the one to distrust.
      # The observed stalls cluster tightly (~297s +/- 22s) and it is tempting to attribute that to
      # the kubelet's EvictionPressureTransitionPeriod (default 5m), which holds DiskPressure true
      # for five minutes after the disk itself recovers. An adversary round refuted that as stated:
      # there are at least THREE independent 5-minute constants in this path
      # (EvictionPressureTransitionPeriod, ImageGCPeriod, and the scheduler's
      # DefaultPodMaxInUnschedulablePodsDuration), and the damper's clock starts at the NODE's last
      # threshold observation while the scheduler flush's starts at the POD's pending time -- so
      # tight clustering is what the FLUSH predicts with no extra assumption, and what the damper
      # predicts only via a coincidence repeated every time. The evidence does not separate them.
      # What settles it: log the node's NodeHasNoDiskPressure event timestamp minus the pod's
      # Scheduled event timestamp. Under 10s => taint-gated. Tens of seconds => scheduler flush.
      #
      # Whichever it is, the stall is minutes, it is invisible to the archived matrix logs (which
      # record ZERO DiskPressure and ZERO FailedScheduling lines), and a bigger disk removes the
      # TRIGGER rather than the mechanism.
      #
      # ⚠️ MOUNT BOTH. Giving containerd its own disk creates a DEDICATED imagefs, and image GC
      # then relieves imagefs ONLY -- a later nodefs event (logs, emptyDir) would have no
      # node-level reclaim path at all and would go straight to evicting pods. KB 408602 mounts
      # both for this reason; do not "simplify" this to one volume.
      #
      # ⚠️ VARIABLE NAME IS CLUSTERCLASS-VERSION-SPECIFIC. builtin-generic-v3.5.0+ calls it
      # `volumes` with a SCALAR `capacity`; KB 408602 shows an older `nodePoolVolumes` form with
      # `capacity.storage`. This repo pins ${VKS_CLUSTERCLASS} (default builtin-generic-v3.6.0),
      # so the scalar form applies. If you change VKS_CLUSTERCLASS, re-check the schema:
      #   kubectl explain clusterclass.spec.variables --recursive | grep -A5 volumes
      - name: volumes
        value:
          - name: containerd
            mountPath: /var/lib/containerd
            storageClass: ${VKS_STORAGE_CLASS}
            capacity: ${VKS_NODE_CONTAINERD_GIB}Gi
          - name: kubelet
            mountPath: /var/lib/kubelet
            storageClass: ${VKS_STORAGE_CLASS}
            capacity: ${VKS_NODE_KUBELET_GIB}Gi
