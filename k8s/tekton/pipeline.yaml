apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ${APP_NAME}-ci
  namespace: ${CI_NAMESPACE}
spec:
  description: >-
    On a push to ${APP_NAME}-app: clone -> test -> build+push image to Harbor ->
    write the new tag back to ${APP_NAME}-deploy (which ArgoCD then syncs).
    ONE template, rendered per app from apps/registry.tsv — only the name and the TEST task
    differ (maven-test for Java, go-test for Go), so the walk is provably identical.
  params:
    - name: app-repo-url
      type: string
    - name: app-revision
      type: string
      default: main
    - name: deploy-repo-url
      type: string
    - name: deploy-revision
      type: string
      default: main
    - name: image
      type: string
      description: App image without tag (e.g. harbor/apps/<app>).
    - name: builder-image
      type: string
    - name: runtime-image
      type: string
    - name: build-args
      type: string
      default: ""
      description: >-
        Extra --build-arg flags for this app's LANGUAGE (scripts/lib/apps.sh app_build_args);
        empty for a language whose Dockerfile needs none.
    - name: registry
      type: string
    - name: insecure-registry
      type: string
      default: "false"
  workspaces:
    - name: shared-data
    - name: dockerconfig
    - name: ca
      optional: true
  tasks:
    - name: clone-app
      taskRef: { name: git-clone }
      params:
        - { name: url, value: $(params.app-repo-url) }
        - { name: revision, value: $(params.app-revision) }
        - { name: subdir, value: app }
        # Block style: a `${VAR}` inside a YAML flow mapping is a syntax error (see below).
        - name: version-cmd-b64
          value: "${APP_VERSION_CMD_B64}"
      workspaces:
        - { name: output, workspace: shared-data }

    - name: test
      runAfter: [clone-app]
      # Block style (not the flow `{ name: ... }` the other taskRefs use): a `${VAR}` token inside a
      # YAML FLOW mapping is a syntax error (the `{` of `${` opens a nested flow map), so yamllint
      # and kubeconform cannot parse the template at all.
      taskRef:
        name: ${APP_TEST_TASK}
      params:
        - { name: subdir, value: app }
        - { name: builder-image, value: $(params.builder-image) }
      workspaces:
        - { name: source, workspace: shared-data }

    - name: build
      runAfter: [test]
      taskRef: { name: kaniko-build }
      params:
        - { name: subdir, value: app }
        - { name: image, value: $(params.image) }
        - { name: tag, value: $(tasks.clone-app.results.commit) }
        # Block style: a `${VAR}` inside a YAML flow mapping is a SYNTAX ERROR (see taskRef above).
        - name: version-tag
          # READ FROM THE CLONE by the clone task, not envsubst'd from the jump box's tree. The
          # rendered form made an operator's Gitea-side bump invisible: the build carried whichever
          # version this repo happened to hold when `make platform` last ran, so a bumped pom in
          # Gitea produced an image tagged with the OLD version and `make verify` then waited out
          # its entire timeout for a deploy that could never happen.
          # A task result is always a string, so this also retires the YAML-float hazard the
          # rendered literal needed quoting for.
          value: $(tasks.clone-app.results.version)
        - { name: builder-image, value: $(params.builder-image) }
        - { name: runtime-image, value: $(params.runtime-image) }
        - { name: build-args, value: $(params.build-args) }
        - { name: registry, value: $(params.registry) }
        - { name: insecure, value: $(params.insecure-registry) }
      workspaces:
        - { name: source, workspace: shared-data }
        - { name: dockerconfig, workspace: dockerconfig }
        - { name: ca, workspace: ca }
