apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: go-test
  namespace: ${CI_NAMESPACE}
spec:
  description: >-
    Run the Go app's tests OFFLINE, on the app's own builder image, whose baked /go/pkg/mod is what
    makes that possible. GOPROXY=off is the air gap made explicit: there is no module proxy to
    reach, so a missing module FAILS loudly here rather than hanging on a dial timeout.

    ⚠️ This description used to say the app was "stdlib-only by design" and that "no builder image
    exists for Go". BOTH became false on 2026-08-22, when the Go app gained its first real
    dependency — and this task's correctness now DEPENDS on the builder image it is handed.
    (Deliberately not naming the app: this task is per-LANGUAGE, so a second Go app inherits this
    text verbatim. check-app-hardcodes enforces that, and it caught this sentence.) MEASURED:
    warm /go/pkg/mod + GOPROXY=off -> ok; EMPTY module cache + GOPROXY=off -> "module lookup
    disabled by GOPROXY=off", FAIL. So if this task is ever pointed at a bare golang image instead
    of the app's builder, it fails in the air gap and nowhere else.
  params:
    - name: subdir
      type: string
      default: repo
    - name: builder-image
      type: string
  workspaces:
    - name: source
  steps:
    - name: test
      image: $(params.builder-image)
      workingDir: $(workspaces.source.path)/$(params.subdir)
      env:
        # The pipeline runs air-gapped: there is no module proxy to reach. Fail fast if a
        # dependency sneaks in, rather than hanging on a dial timeout.
        - name: GOPROXY
          value: "off"
        - name: GOFLAGS
          value: "-mod=mod"
        # HOME must be writable for the build cache; the Tekton workspace is.
        - name: GOCACHE
          value: $(workspaces.source.path)/.gocache
      script: |
        #!/bin/sh
        set -eu
        go vet ./...
        go test ./...
