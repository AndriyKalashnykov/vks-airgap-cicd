name: CI

# Offline-verifiable gates for the air-gapped VKS CI/CD demo.
# Flow: changes → (static-check, docs-lint) → ci-pass (single required check).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # A weekly full run over main, and it is NOT redundant with the push runs. It is the only thing
  # that covers a DROPPED PUSH EVENT: 7d90aa9 (a real code merge, 2026-07-19) has ZERO runs of any
  # workflow -- verified via `gh api actions/runs?head_sha=`, and it is the only one of the last 60
  # main commits missing. Nothing was in-flight to cancel it and the next run was a `pull_request`
  # (a different concurrency group), so concurrency cannot explain it and the `cancel-in-progress`
  # change below CANNOT cover it. Unexplained, and recorded as unexplained rather than folded into
  # the concurrency story. A schedule also re-runs the scanners against a drifted vuln DB, which a
  # push-only repo never does.
  schedule:
    - cron: '17 6 * * 1'

# Least privilege: jobs only read the repo.
permissions:
  contents: read

# One in-flight run per ref. Cancel superseded runs on a PR BRANCH (only the tip matters there);
# NEVER on main, where each commit deserves its own verification.
#
# WHY, measured 2026-07-19: with `cancel-in-progress: true` on main, merging code and then a
# docs-only commit minutes later LOSES the code commit's static-check -- the code run is cancelled,
# and the superseding run legitimately SKIPS static-check because ITS OWN diff is docs-only
# (the `changes` filter working as designed). It happened THREE times in one day
# (4fad575, bf82e7f, d0a091a). The immediate, certain benefit is not the re-verification, though:
# it is that every cancelled run leaves main showing `ci-pass: failure` for a NON-failure, which
# trains readers to ignore main's status.
#
# Cost is negligible and was measured, not assumed: docs runs ~50s, code runs 2:46-8:00; not
# cancelling costs roughly 15 extra runner-minutes across 60 commits.
#
# NOTE a SECOND mechanism this does NOT touch: `concurrency.queue` defaults to `single`, so a
# PENDING run is still discarded when a newer one queues. It did not fire in the observed window
# (no third push arrived inside any run), so it is latent. `queue: max` would close it, but the
# docs say `queue: max` + `cancel-in-progress: true` is a validation error, and whether that check
# fires against an EXPRESSION that evaluates true on PRs is UNVERIFIED -- so it is deliberately NOT
# combined here. Test it on a throwaway branch before adding.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which gates does this change actually need? Runner minutes are BILLED, so a docs-only
  # change must not pay for a full Java+Go build.
  #
  # This used to be dorny/paths-filter with a "deny-list" (`'**'` then `'!**/*.md'`), and it
  # DID NOT WORK: paths-filter ORs the globs, so `'**'` matched on its own and the `!` lines
  # subtracted nothing. Every docs-only PR reported `code = true` — with an EMPTY "Matching
  # files:" list, which is the tell — and paid ~2 minutes of billed runner time for a build it
  # did not need. Nothing ever failed, so nothing surfaced it; it just quietly cost money.
  #
  # The decision itself lives in scripts/classify-changes.sh, which has a unit test
  # (make test-scripts) — logic that costs money gets a test. This job only fetches the file
  # list. It keeps the deny-list SEMANTICS that motivated the original (anything that is not
  # pure docs — renovate.json, .trivyignore, a new root config — runs static-check, so no
  # change can slip through with zero gates).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      diagrams: ${{ steps.filter.outputs.diagrams }}
    steps:
      # fetch-depth: 0 is REQUIRED here: the push arm below answers "what changed?" with
      # `git diff`, offline, instead of the compare API. Repo is ~15 MiB / ~750 commits, so a
      # full clone is cheap. ⚠️ Do NOT copy this to the `secrets` job — its own comment records
      # fetch-depth: 1 as LOAD-BEARING for gitleaks (a full history makes it scan commits
      # instead of the worktree).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "gh: $(gh --version 2>/dev/null | head -1)"   # `gh api` has NO --retry flag; see below
          # `git_or_api` echoes the changed-file list and returns non-zero if it could not
          # determine one. It must NOT print anything else on stdout (the caller captures it).
          git_or_api() {
            case "$EVENT" in
              pull_request)
                # MEASURED healthy during the 2026-08-17 compare-endpoint outage (6/6), so the
                # PR arm stays on the API. NOTE: no --paginate on `compare` ever — pages 2+ of a
                # compare carry no `.files` key, so paginating it is actively wrong.
                gh api "repos/${REPO}/pulls/${PR}/files" --paginate --jq '.[].filename' ;;
              push)
                # A first push / a new branch / a tag has an all-zero `before`: nothing to
                # compare to, so the list stays empty and classify-changes.sh runs every gate.
                case "$BEFORE" in
                  ''|0000000000000000000000000000000000000000) : ;;
                  *)
                    # `git diff` is exact, offline, and has no 300-file cap. It replaces
                    # `gh api repos/.../compare/A...B`, which on 2026-08-17 returned HTTP 404
                    # for ~95-100% of calls for over 20 minutes (MEASURED: 0/9 on three sha
                    # pairs, 1/20 on a fourth) while the rate limit was untouched
                    # (4961/5000) — i.e. a sustained endpoint outage, not throttling, and not
                    # retryable: `gh api` has no --retry flag, and at p(fail)~0.95 a 3x retry
                    # still fails ~86%. It reddened `main` on a docs-only merge.
                    # A force-push or a rebase can leave BEFORE unreachable; that is the one
                    # case we cannot answer, so fail and let the caller degrade.
                    git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || return 1
                    git diff --name-only "$BEFORE" "$SHA" ;;
                esac ;;
            esac
          }
          files=""; determined=1
          files="$(git_or_api)" || determined=0
          if [ "$determined" -eq 0 ]; then
            # DEGRADE, never die: an empty list makes classify-changes.sh turn EVERY gate ON
            # (MEASURED: 0 bytes / 1 newline / 2 newlines all yield code=true docs=true
            # diagrams=true). That is strictly MORE checking, so it is safe — but it is also
            # byte-indistinguishable from a legitimate no-change run, which is the exact
            # "green while not looking" shape this job exists to prevent. So SAY SO where a
            # green run is still readable: a ::warning:: alone is effectively invisible.
            files=""
            echo "  changed: <UNKNOWN — lookup FAILED; assuming EVERYTHING changed>"
            echo "::warning::change classification DEGRADED — could not determine the changed files; every gate will run"
            echo '### ⚠️ change classification DEGRADED — every gate forced ON' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '%s\n' "$files" | sed '/^$/d; s/^/  changed: /'
          printf '%s\n' "$files" | ./scripts/classify-changes.sh | tee -a "$GITHUB_OUTPUT"

  # Composite code gate: check-env + lint + validate + app-test (Java 25 via mise).
  static-check:
    needs: changes
    # CURRENT STATE, hoisted 2026-08-17 because the history below is append-only and its stale
    # headline is what a skimmer reads: this job is ENABLED and runs per-PR whenever
    # `changes.outputs.code == 'true'`, invoking `static-check-pr` (lint + validate + app-test +
    # test-scripts-fast). Only the weekly SCHEDULE invokes the full `static-check` — so `sec`
    # (gitleaks + trivy-fs + trivy-config) and the wall-clock tests are NOT on the PR path. The
    # `if:` at the bottom of this comment block is the authority; everything between here and it is
    # the reasoning, in the order it happened.
    #
    # ⚠️ DISABLED on request 2026-08-11 [SUPERSEDED — see the two restorations below].
    # It was 2m44s of a 3m03s run — see the profile in
    # PR #524/#525: shellcheck 46s, test-scripts 40s (now ~30s), trivy 32s, go 20s, java 11s.
    # The job is left in the graph (and in ci-pass's `needs`) so re-enabling is ONE line:
    # restore `needs.changes.outputs.code == 'true'`.
    #
    # WHAT YOU LOSE WHILE IT IS OFF — ci-pass's condition is only
    #   contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
    # and a SKIPPED job is neither, so ci-pass stays GREEN with none of this having run:
    # the alignment gates, lint (shellcheck/yamllint/hadolint), validate (kubeconform),
    # sec (gitleaks + trivy-fs + trivy-config), the script unit tests, and the app build+tests.
    # `make static-check` locally is unaffected and still runs all of it.
    #
    # RESTORED FOR THE SCHEDULE (2026-08-16). `if: false` did not only disable this on PRs — it
    # silently killed the weekly cron above too, so the FULL gate set (lint, validate, trivy-fs,
    # trivy-config, test-scripts, app-test) was running NOWHERE: not on PRs, not on main, not
    # weekly.
    #
    # AND NOW RESTORED PER-PR TOO, at a MEASURED fraction of the cost that got it disabled.
    # The hole was not theoretical: ci-pass only tests for failure/cancelled, and a SKIPPED job is
    # NEITHER — so with this job off the PR path, ci-pass went green with lint, validate, sec, the
    # script unit tests and the app build having run nowhere. That is exactly how #605's
    # half-applied Go toolchain bump merged green and then sat red on `main` until someone found
    # it by hand.
    #
    # The per-PR target is `static-check-pr` (lint + validate + app-test + test-scripts-fast), NOT
    # the full `static-check`. It deliberately omits trivy-fs/trivy-config — the vuln-DB cache was
    # dropped ON PURPOSE, so per-PR trivy means a cold DB download every run — and the six unit
    # tests that assert WALL-CLOCK by design (136s of test-scripts' 154s).
    # MEASURED locally, on a box concurrently rebuilding a lab: `static-check-pr` rc=0 in 43.9s
    # wall (268% CPU, so it does parallelise); of that, test-scripts-fast was 19s for 42 tests.
    # Expect more on a 4-vCPU runner — lint alone measures 25.6s at 4 cores, 47.4s at 2, because
    # it is CPU-bound and does NOT shrink with caching.
    # TO REVERT: put back `if: github.event_name == 'schedule'`. One line, as before.
    if: github.event_name == 'schedule' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # THE toolchain step: mise installs EVERY tool in .mise.toml — java (temurin 25),
      # maven, go, kubectl, helm, kustomize, kind, jq, yq, crane, node, trivy, gitleaks,
      # shellcheck, kubeconform, hadolint, yamllint — and puts them on PATH with
      # JAVA_HOME/GOROOT set. That is the whole point of the version-manager policy:
      # ONE pinned file, no per-language setup step. mise-action caches the installs,
      # so a warm run costs seconds.
      #
      # There is deliberately NO actions/setup-java here. There used to be, from before
      # java was pinned in .mise.toml — and it was pure dead weight: it ran BEFORE this
      # step, so mise's JAVA_HOME overrode its, it installed a second JDK nobody used,
      # and it wrote a toolchains.xml the pom never reads. Its only lasting effect was a
      # SECOND source of truth for the Java major (`java-version: '25'`), which
      # check-java-alignment then had to police. Java comes from .mise.toml. Full stop —
      # and check-java-alignment now FAILS if a java-version pin reappears here.
      #
      # There is ALSO deliberately no bespoke "Install kubeconform, yamllint, hadolint"
      # step. There used to be one: it curl'd two GitHub-release binaries into
      # /usr/local/bin and ran `pipx install yamllint` (UNPINNED) on EVERY run — ~25 s
      # of billed runner time, uncached, and a second source of truth for two tool pins
      # that only CI could see (a local `make lint` used whatever the dev box had).
      # All three ARE in mise's registry (kubeconform + hadolint via aqua, yamllint via
      # pipx/uv); they are pinned in .mise.toml and installed by the step above.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      # Persist kubeconform's downloaded JSON schemas across runs (validate.sh
      # points kubeconform -cache here) so githubusercontent isn't re-hit every run.
      #
      # ⚠️ THE KEY MUST VARY WITH CONTENT. It used to be the constant `kubeconform-schemas-v1`
      # with NO restore-keys, and that is a cache that stops working after its first write:
      # actions/cache DOES NOT SAVE on an exact-key hit, so the entry was frozen at whatever
      # schemas happened to be in it the first time it ran. Every schema added since — a new
      # kind, a new CRD, a new k8s version — was re-downloaded on EVERY run, forever, which is
      # most of what `validate` was spending its time on.
      # Content-hashing the manifests mints a NEW entry whenever the schema set can have
      # changed, and `restore-keys` lets an unrelated change still warm-start from the closest
      # previous entry. (Schema MISSES — datreeio 404s for CRDs it does not carry — can never
      # be cached and are paid regardless; that is a separate, known cost.)
      # ⚠️ RESTORE AND SAVE ARE SPLIT ON PURPOSE — a combined `actions/cache` CANNOT warm this cache
      # after a failure, which makes a throttle outage SELF-SUSTAINING. `actions/cache@55cc8345…`
      # (v6) declares `post-if: "success()"` in its own action.yml AT THIS PINNED SHA, so its
      # save runs ONLY when the job succeeded. Under KUBECONFORM_REQUIRE_SCHEMAS=1 a CDN throttle
      # FAILS the job — which is precisely when we have just paid to fetch the schemas — so they
      # were DISCARDED and the next run started from the same cold entry. Any unrelated red (lint,
      # app-test) threw the fetch away too. MEASURED on PR #745: attempt 2 reached 3m15s and died
      # with `16 of 16 resource(s) could not have their schema downloaded`.
      #
      # `if: always()` on the save is what closes it. That is safe HERE specifically because the
      # key is CONTENT-ADDRESSED (below): a partial save cannot serve a stale answer for different
      # content — it can only under-fill an entry that a later run tops up. This is the same
      # argument this file already makes for the Go build cache.
      - name: Restore kubeconform schema cache
        id: kubeconform-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/kubeconform
          # 'tekton/**' matched NOTHING and was dropped: `git ls-files tekton` = 0, because the
          # manifests live at k8s/tekton/ (9 files) and are already covered by 'k8s/**'. Same
          # dead-path rot already corrected once in the adversary hook's GUARDED_PREFIXES.
          #
          # ⚠️ CORRECTED — a "KNOWN GAP" recorded here (that this key omits KUBERNETES_VERSION, so a
          # version bump reuses schemas fetched for the OLD one) was REFUTED BY MEASUREMENT
          # 2026-08-18: kubeconform's OWN `-cache` is VERSION-DISCRIMINATING. Same cache dir,
          # `-kubernetes-version 1.31.0` then `1.30.0` -> entries went 1 -> 2. A bump MISSES and
          # refetches; it CANNOT serve a 1.30 schema for a 1.31 request. Adding KUBERNETES_VERSION
          # to this key would therefore buy ZERO correctness and cost a full re-fetch of the whole
          # set on every bump. Do not add it. (See BACKLOG B156.)
          key: kubeconform-v2-${{ hashFiles('k8s/**', 'deploy/**') }}
          restore-keys: |
            kubeconform-v2-

      # Persist the Maven local repo across runs — static-check runs mvn twice (app-test's `mvnw test`
      # AND, via sec→trivy-fs→app-build, `mvnw package`), and both cold-download the whole Spring Boot
      # dependency tree. Cache `~/.m2` (not just `repository/`) so it also grabs the ~9.6 MB Maven
      # distribution the only-script `mvnw` downloads into `~/.m2/wrapper/dists/`. Key = pom hash, so a
      # BOM/parent/dependency bump busts it and mvn re-resolves the delta from Central — a warm cache
      # cannot mask an unresolvable dep (the poms pin exact versions; no ranges/SNAPSHOTs).
      # (Reviewed by java-adversary + docker-adversary 2026-07-14: the trivy-DB cache was DROPPED — it
      # would silently serve a DB up to trivy's 24h client interval, missing same-day CVEs, for ~10s;
      # and the job-split was skipped as marginal ROI + a ruleset-rename risk.)
      - name: Cache Maven ~/.m2 (deps + mvnw-downloaded Maven)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('apps/**/pom.xml') }}
          restore-keys: maven-

      # GO BUILD + MODULE CACHE. Maven had a cache and Go had NONE, and the asymmetry is the whole
      # reason Go cost ~2x Java in this job. MEASURED on run 31451956799 (a scripts/docs-only PR):
      #   go build 11s + go vet/go test 9s = 20s   vs   mvn package 4s + mvn test 7s = 11s
      # with GOCACHE and GOMODCACHE cold on every single run, so the stdlib is recompiled each time.
      #
      # Unlike the trivy-DB cache (deliberately DROPPED above, and left dropped), this one cannot go
      # stale in a correctness sense: Go's build cache is CONTENT-ADDRESSED — an entry is keyed by the
      # hash of its inputs, so a changed source or toolchain simply misses and rebuilds. There is no
      # "serves an old answer" failure mode to trade against.
      #
      # WHAT IS ACTUALLY BEING CACHED: gowebapp is STDLIB-ONLY — go.mod has zero `require` lines and
      # there is NO go.sum — so GOMODCACHE is empty and the 11s is entirely the CGO_ENABLED=0 stdlib
      # compile. That is precisely what ~/.cache/go-build holds. ~/go/pkg/mod is listed anyway so the
      # cache keeps working the day a dependency is added; today it contributes nothing.
      # Key on the toolchain pin + go.mod (go.sum does not exist, and hashFiles tolerates a
      # non-matching pattern): a Go version bump or a dep change must invalidate it.
      - name: Cache Go build + modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('.mise.toml') }}-${{ hashFiles('apps/**/go.mod', 'apps/**/go.sum') }}
          restore-keys: |
            go-${{ hashFiles('.mise.toml') }}-
            go-

      # The weekly run gets the FULL gate; a PR gets the per-PR half. Same job, same caches, one
      # expression — rather than a second job that would have to re-derive mise and all three
      # cache steps, and whose copy would be where the next silent cache bug lands.
      - name: make static-check
        env:
          # CI has network by definition, so a schema that could not be FETCHED is a FAILURE here,
          # not a skip — the same reason static-check-fast sets GWAPI_REQUIRE_FETCH=1 below.
          # MEASURED 2026-08-16 without it, both schema sources pointed at a black hole:
          # `make validate` exited 0 printing "validate: OK" while EIGHT directories reported
          # N-of-N resources could not have their schema downloaded (16/16, 9/9, 8/8, 3/3, 2/2,
          # 2/2, 1/1, 1/1). A green gate over ZERO validated resources — and on a cold runner
          # whose kubeconform cache missed and whose CDN call was throttled, that is the live case.
          # The lenient default stays for local dev (a laptop on a train must not red on a CDN).
          KUBECONFORM_REQUIRE_SCHEMAS: '1'
          GWAPI_REQUIRE_FETCH: '1'
        run: make ${{ github.event_name == 'schedule' && 'static-check' || 'static-check-pr' }}

      # THE OTHER HALF OF THE SPLIT (see the restore step's comment). `if: always()` is the whole
      # point: the run we MOST need to persist is the one that FAILED on a throttle, because it is
      # the run that just paid to fetch. Without this the failure is self-sustaining.
      # `cache-hit` is only ever 'true' on an EXACT key hit, in which case the entry is already
      # complete and re-saving is both wasteful and rejected by the backend — so skip only that case,
      # never the failure case.
      #
      # ⚠️ UNGUARDED RESIDUAL, stated rather than implied: nothing asserts that this stays split.
      # Re-merging it into a single `actions/cache` step silently restores the bug, and a Renovate
      # bump to a SHA whose `post-if` differs would too. The regression is INVISIBLE in a green run —
      # it shows up only as a cold cache on the next throttle. Same shape as the `apk upgrade`
      # under-layer-cache trap: the mechanism goes inert and only a marker would prove it ran.
      - name: Save kubeconform schema cache
        if: always() && steps.kubeconform-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/kubeconform
          key: ${{ steps.kubeconform-cache.outputs.cache-primary-key }}

  # Docs gate: markdownlint (via npx) + the README-scenario gate. CHEAP — no Docker.
  docs-lint:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Node so `npx markdownlint-cli` works.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: make docs-lint
        run: make docs-lint

  # Diagram drift gate — SEPARATE from docs-lint because it is FAR more expensive: it `docker run`s
  # the pinned PlantUML image (~478 MB cold) and re-renders every .puml to byte-compare it against
  # the committed PNG. It used to be an unconditional prerequisite of docs-lint, so every README-only
  # PR paid for a render of seven diagrams it never touched. It now runs only when a diagram source,
  # a committed PNG, or the renderer pin (PLANTUML_VERSION, in the Makefile) actually changed.
  diagrams-check:
    needs: changes
    if: needs.changes.outputs.diagrams == 'true'
    runs-on: ubuntu-latest
    # podman is the local default; on the runner use docker for the diagram render
    # (rootless-podman keep-id isn't guaranteed configured on the runner).
    env:
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: make diagrams-check
        run: make diagrams-check

  # Secret scanning guards *.md as much as it guards code — so it must NOT hang off `code == true`.
  #
  # It used to live only in `sec` -> `static-check`, which runs `if: code == 'true'`. A DOCS-ONLY PR
  # classifies as code=false/docs=true, so static-check is SKIPPED — and a docs-only PR is the ONLY
  # shape that can introduce a prose credential into a runbook, which is precisely what
  # `prose-secrets` exists to catch (gitleaks misses natural-language secrets). The gate was
  # unreachable from the one PR shape it was written for. Proven: a planted `admin / <random>` line
  # in a .md fails scripts/check-prose-secrets.sh (rc=1) while `make docs-lint` — the only gate that
  # PR ran — exits 0.
  #
  # Deliberately NO `if:` — every changed path classifies as code or docs (and an empty list forces
  # both true), so `code || docs` is a tautology. Running unconditionally makes the SECURITY gate
  # structurally immune to a future classifier bug, and the classifier has already been wrong once
  # (the dorny/paths-filter deny-list, see scripts/classify-changes.sh).
  # UNCONDITIONAL, like `secrets` below and for the same reason: a job that can be SKIPPED cannot
  # be asserted on, because `ci-pass`'s generic check tests only failure||cancelled and a skip is
  # neither. That is exactly how PR #605's half-applied Go bump merged green while
  # check-toolchain-alignment would have caught it. Making the job unconditional turns `skipped`
  # into an unambiguous defect, which is what lets the explicit assertion in ci-pass work.
  #
  # NO mise here. MEASURED 2026-08-16: all 23 gates pass with the mise toolchain OFF PATH (rc=0) —
  # they are shell/grep/python3/jq, and ubuntu-latest preinstalls python3 and jq. Dragging in the
  # JDK/Go/kubectl/helm toolchain for them would cost more than the gates do.
  # `needs: []` on purpose: this job does not consult the change classifier at all.
  static-check-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # check-gwapi-istio-alignment fetches istio's go.mod and, by default, SKIPS with a warning
      # when the fetch fails — exit 0. Measured against a blackholed proxy it returned rc=0 with
      # three WARN lines, i.e. this job would go green with the only gate guarding the Gateway-API
      # CRD pin having covered nothing. CI has network by definition, so here a failed fetch is a
      # FAILURE. Local runs keep the loud skip.
      - name: make static-check-fast
        env:
          GWAPI_REQUIRE_FETCH: '1'
        run: make static-check-fast

  secrets:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 1 is LOAD-BEARING for gitleaks. `gitleaks detect` scans git HISTORY, not the
      # working tree; with a shallow checkout the single root commit has no parent, so it is diffed
      # against the empty tree — i.e. the whole worktree is scanned as additions. `fetch-depth: 0`
      # (which gitleaks' own docs suggest) would silently turn this into a history-only scan of a
      # history that is already clean: a gate that passes by not looking. Do not "fix" this.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Only gitleaks — still pinned by .mise.toml (one source of truth), but without dragging in
      # the JDK/Go/kubectl/helm toolchain that static-check needs. cache:false so we don't restore
      # (or save) that job's much larger cache just to obtain one Go binary.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          install_args: gitleaks
          cache: false

      - name: make secrets-scan
        run: make secrets-scan

  # Single required status check: fails if any needed job failed/cancelled,
  # passes if they succeeded or were legitimately skipped by paths-filter.
  ci-pass:
    needs: [changes, static-check, static-check-fast, docs-lint, diagrams-check, secrets]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read      # required to read this run's own jobs; without it the API 403s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify required jobs — from the JOBS API, not the needs context
        # ⚠️ THE `needs` CONTEXT LIES WHEN A JOB DIES DURING SET-UP, and this gate is the SOLE
        # required status check on the repo. MEASURED over 400 runs: three times — including once
        # on main — `secrets` finished at conclusion `failure` while the old guard,
        # `contains(needs.*.result,'failure')`, rendered in its own step log as literally
        # `if false; then`, so ci-pass reported SUCCESS over a failed security scan.
        #   runs 32041902265, 32043952216, 32044803928
        # Root cause of all three, from the failing job's log: "Prepare all required actions" hit
        # codeload.github.com 429/429/503 downloading an action. Transient GitHub infrastructure,
        # so it recurs, and `secrets` is the most exposed job (two action downloads).
        #
        # The jobs API reported the truth in every case examined, so read that instead. The verdict
        # itself lives in scripts/ci-pass-verdict.sh, offline and unit-tested by
        # scripts/test-ci-pass-verdict.sh — which also asserts that script's job lists still agree
        # with THIS file's job list and with the `needs:` above, so a renamed or added job fails at
        # PR time instead of refusing every run.
        env:
          GH_TOKEN: ${{ github.token }}   # gh needs an explicit token even for a public endpoint
        run: |
          set -uo pipefail
          rc=0            # initialised: `set -u` + the `|| rc=$?` form means it is unset on the happy path
          # ⚠️ NO `filter` PARAMETER. The API default is the LATEST attempt, which is what we must
          # judge. MEASURED: with filter=all this sees every attempt, so runs 32044956290 and
          # 32044785511 — genuinely green after a re-run — would be refused on attempt 1's failure,
          # making a `rerun --failed` that FIXES ci permanently unmergeable.
          #
          # (.conclusion // "none"): a still-running job has conclusion null, and an EMPTY field
          # would be swallowed — TAB is IFS-whitespace, so `read` collapses a run of tabs and every
          # later field shifts left. The sentinel keeps every field non-empty.
          gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            --jq '.jobs[] | [ .name, (.conclusion // "none"),
                  ([ .steps[]? | select(.name != "Set up job" and .name != "Complete job") ] | length)
                ] | @tsv' > /tmp/ci-jobs.tsv || rc=$?
          # ⚠️ `|| rc=$?`, NOT a bare `rc=$?` on the next line. GitHub runs a `run:` block as
          # `/usr/bin/bash -e {0}`, and the `set -uo pipefail` above does NOT clear that `-e` — so a
          # failing `gh api` killed the step AT THE GH LINE and `rc=$?` never executed. The outcome
          # was still fail-closed (the job failed), but the operator got a bare gh error instead of
          # the sentence below naming the cause — and the cause is an API 5xx, i.e. the SAME outage
          # class that produced this control's founding incident. Reproduced both ways 2026-08-17:
          # with `-e` -> rc=1 and NO output; without -> the message prints.
          if [ "${rc:-0}" -ne 0 ] || [ ! -s /tmp/ci-jobs.tsv ]; then
            echo "the jobs API read produced nothing (rc=$rc) — refusing rather than assuming green"
            exit 1
          fi
          echo "--- jobs as the API reports them ---"; cat /tmp/ci-jobs.tsv; echo "---"
          ./scripts/ci-pass-verdict.sh < /tmp/ci-jobs.tsv
