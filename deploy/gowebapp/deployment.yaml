apiVersion: apps/v1
kind: Deployment
metadata:
  name: gowebapp
  labels:
    app.kubernetes.io/name: gowebapp
    app.kubernetes.io/part-of: vks-airgap-cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gowebapp
  template:
    metadata:
      labels:
        # istio-injection=disabled on the NAMESPACE is the primary control (lib/psa.sh,
        # ensure_namespace). This pod-level LABEL is the race guard: ArgoCD's
        # CreateNamespace=true can create the ns and sync this pod before the installer
        # labels it. A LABEL, not an annotation -- a webhook objectSelector is a
        # LabelSelector and never matches annotations (Backlog B26).
        sidecar.istio.io/inject: "false"
        app.kubernetes.io/name: gowebapp
    spec:
      # Harbor image-pull credential, created in this namespace by 70-configure-argocd.sh.
      # REQUIRED when the Harbor project is private (the tenant default: HARBOR_PUBLIC_PROJECTS=false);
      # harmless when it is public. Without it every pod here goes ImagePullBackOff.
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        # distroless:nonroot is uid/gid 65532 — NOT the 10001 the Java app creates. Using 10001
        # here would make the kubelet refuse to start the container (the image has no such user).
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gowebapp
          # kustomize `images:` transformer rewrites this name to the Harbor ref + tag.
          # The Tekton write-back task bumps the tag in kustomization.yaml on each build.
          image: gowebapp
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # ⚠️ PLACEHOLDERS — kustomize `replacements` (see kustomization.yaml) overwrites BOTH from
            # the image reference after the `images` transformer has applied newTag. The Tekton
            # write-back bumps newTag to the commit SHA on every successful build, so these end up
            # showing the commit that is ACTUALLY deployed. Before this, both apps showed only their
            # in-code defaults ("dev"/"0.1.0" and "unknown") while the running image was :ecae614 —
            # the information existed and never reached the app.
            - name: APP_VERSION
              value: "dev"
            - name: APP_COMMIT
              value: "unknown"
            - name: APP_INTERNAL_PORT
              value: "8080"
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 1
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            # An order of magnitude smaller than the JVM's — a static Go binary needs no heap
            # headroom. This is the visible payoff of the second language in the demo.
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "500m", memory: "64Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      # No /tmp emptyDir: unlike Spring Boot/Tomcat, the Go binary writes nothing to disk, so a
      # read-only root filesystem needs no writable mount at all.
