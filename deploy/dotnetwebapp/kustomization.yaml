apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dotnetwebapp

resources:
  - deployment.yaml
  - service.yaml

images:
  - name: dotnetwebapp
    newName: harbor.vks.local/apps/dotnetwebapp
    newTag: "0.1.0"

replicas:
  - name: dotnetwebapp
    count: 2

# Carry the DEPLOYED image tag into the app's own version/commit display, sourced from the container
# image AFTER the images transformer applies newTag, so it always matches what is really running.
replacements:
  - source:
      kind: Deployment
      name: dotnetwebapp
      fieldPath: spec.template.spec.containers.[name=dotnetwebapp].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: dotnetwebapp
        fieldPaths:
          - spec.template.spec.containers.[name=dotnetwebapp].env.[name=APP_VERSION].value
          - spec.template.spec.containers.[name=dotnetwebapp].env.[name=APP_COMMIT].value
