apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace ArgoCD deploys into. The seed step rewrites it per-app from the app registry.
namespace: nodejswebapp

resources:
  - deployment.yaml
  - service.yaml

# The demo app image. The seed sets newName to $HARBOR_URL/$HARBOR_APP_PROJECT/nodejswebapp; the
# Tekton write-back task bumps newTag on every successful build (that commit is what ArgoCD syncs).
images:
  - name: nodejswebapp
    newName: harbor.vks.local/apps/nodejswebapp
    # ⚠️ THIS MUST BE UNPULLABLE, BY CONSTRUCTION. It is the SEEDED value: 50-seed-gitea-repos.sh
    # rewrites newName/namespace/replicas and DELIBERATELY NOT this, so ArgoCD syncs it on a fresh
    # install — before any build exists — and the pods go ImagePullBackOff. That LOUD failure is the
    # correct baseline: `install-all` builds no app image (B529), so "nothing is deployed yet" must
    # be visible, not silently satisfied.
    #
    # It used to be "0.1.0", which was safe only because nothing ever pushed that tag. The build now
    # tags every image with the app's DECLARED version (scripts/lib/apps.sh:app_version) alongside
    # the sha — so "0.1.0" became REAL and PULLABLE, and this placeholder would have silently
    # deployed a PREVIOUS run's build instead of failing. With imagePullPolicy: IfNotPresent (6/6)
    # a node holding a cached layer would never even re-pull. Caught by an idea round before it
    # shipped; the tag write-back replaces this on the first successful build.
    newTag: "NEVER-BUILT-RUN-THE-PIPELINE"

replicas:
  - name: nodejswebapp
    count: 2

# Carry the DEPLOYED image tag into the app's own version/commit display.
# ⚠️ Sourced from the container image AFTER the `images` transformer above applies newTag, so it
# always matches what is really running. `delimiter: ":"` + `index: 1` takes the tag off
# `<registry>/<project>/nodejswebapp:<tag>`.
replacements:
  - source:
      kind: Deployment
      name: nodejswebapp
      fieldPath: spec.template.spec.containers.[name=nodejswebapp].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: nodejswebapp
        fieldPaths:
          - spec.template.spec.containers.[name=nodejswebapp].env.[name=APP_VERSION].value
          - spec.template.spec.containers.[name=nodejswebapp].env.[name=APP_COMMIT].value
