apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejswebapp
  labels:
    app.kubernetes.io/name: nodejswebapp
    app.kubernetes.io/part-of: vks-airgap-cicd-demo
spec:
  replicas: 2
  # ⚠️ A LITERAL, NOT A ${VAR}. These manifests are seeded VERBATIM into the <app>-deploy
  # Gitea repo and applied by ArgoCD as-is -- 50-seed-gitea-repos.sh runs no envsubst, so a
  # token would reach the API server unrendered. It is therefore a KEEP-as-constant value:
  # externalising it to .env would create a second source of truth that nothing renders.
  # check-deploy-manifests.sh asserts all six agree, which is what a duplicated constant
  # needs in place of a variable.
  #
  # 3, not the Kubernetes default of 10. Every `make verify` run is one rollout, so the
  # ReplicaSet list is a log of verify runs: MEASURED 2026-09-06, 11 ReplicaSets per app at
  # revision 23. They hold 0 replicas and exist only for `kubectl rollout undo`, so the cost
  # is API objects and an unreadable ArgoCD resource tree rather than compute. 3 keeps two
  # rollbacks available -- enough to step back past a bad build and the one before it.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nodejswebapp
  template:
    metadata:
      labels:
        # istio-injection=disabled on the NAMESPACE is the primary control (lib/psa.sh,
        # ensure_namespace). This pod-level LABEL is the race guard: ArgoCD's
        # CreateNamespace=true can create the ns and sync this pod before the installer
        # labels it. A LABEL, not an annotation -- a webhook objectSelector is a
        # LabelSelector and never matches annotations (Backlog B26).
        sidecar.istio.io/inject: "false"
        app.kubernetes.io/name: nodejswebapp
    spec:
      # Harbor image-pull credential, created in this namespace by 70-configure-argocd.sh.
      # REQUIRED when the Harbor project is private (the tenant default: HARBOR_PUBLIC_PROJECTS=false);
      # harmless when it is public. Without it every pod here goes ImagePullBackOff.
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        # 1000:1000 is the `node` user baked into node:*-alpine, and it is what the runtime stage
        # selects (apps/nodejs/nodejswebapp/Dockerfile:36 `USER 1000:1000`). It is NOT the Java
        # app's 10001 nor the Go app's 65532 -- each image ships a different non-root user, and a
        # uid the image does not define makes the kubelet refuse to start the container.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nodejswebapp
          # kustomize `images:` transformer rewrites this name to the Harbor ref + tag.
          # The Tekton write-back task bumps the tag in kustomization.yaml on each build.
          image: nodejswebapp
          # ⚠️ Always, NOT IfNotPresent — the deployed tag is now the app's DECLARED VERSION,
          # which MOVES: rebuilding without a bump re-points the same tag at a new digest. Under
          # IfNotPresent a node holding a cached layer would keep serving the OLD build forever and
          # the page would silently lie. With an immutable sha tag IfNotPresent was correct; it is
          # not correct for a moving tag.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # ⚠️ PLACEHOLDERS — kustomize `replacements` (see kustomization.yaml) overwrites BOTH from
            # the image reference after the `images` transformer has applied newTag, so they end up
            # showing the commit that is ACTUALLY deployed rather than an in-code default.
            - name: APP_VERSION
              value: "dev"
            - name: APP_COMMIT
              value: "unknown"
            - name: APP_INTERNAL_PORT
              value: "8080"
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 1
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            # Between the Go binary (16Mi) and the JVM: a Node process carries a V8 heap but no
            # JVM metaspace. Not tuned against a running pod yet -- revisit with real usage.
            requests: { cpu: "10m", memory: "48Mi" }
            limits: { cpu: "500m", memory: "192Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      # No /tmp emptyDir, and that is MEASURED rather than copied: server.js has zero fs/writeFile/
      # mkdir calls and `express` is its only dependency, so nothing writes to disk at runtime.
      # The Java app needs one because the JVM/Tomcat unpacks to /tmp; this does not.
