apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace ArgoCD deploys into. `make seed-gitea` runs `kustomize edit set
# namespace $ARGOCD_DEST_NAMESPACE` on the seeded copy to match .env.
namespace: javawebapp

resources:
  - deployment.yaml
  - service.yaml

# The demo app image. `make seed-gitea` sets newName to
# $HARBOR_URL/$HARBOR_APP_PROJECT/$APP_NAME; the Tekton write-back task bumps
# newTag on every successful build (that commit is what ArgoCD syncs).
images:
  - name: javawebapp
    newName: harbor.vks.local/apps/javawebapp
    newTag: "0.1.0"

replicas:
  - name: javawebapp
    count: 2

# Carry the DEPLOYED image tag into the app's own version/commit display.
# ⚠️ Sourced from the container image AFTER the `images` transformer above applies newTag, so it
# always matches what is really running. `delimiter: ":"` + `index: 1` takes the tag off
# `<registry>/<project>/javawebapp:<tag>`.
replacements:
  - source:
      kind: Deployment
      name: javawebapp
      fieldPath: spec.template.spec.containers.[name=javawebapp].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: javawebapp
        fieldPaths:
          - spec.template.spec.containers.[name=javawebapp].env.[name=APP_VERSION].value
          - spec.template.spec.containers.[name=javawebapp].env.[name=APP_COMMIT].value
