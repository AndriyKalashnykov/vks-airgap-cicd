# gitleaks config — needed ONLY for the working-tree leg of `make secrets`.
#
# WHY THERE IS A WORKING-TREE LEG AT ALL
# `gitleaks detect` scans git HISTORY, not the working tree. So `make secrets` could not catch a
# secret you were ABOUT TO COMMIT — only one already committed, at which point the secret must be
# rotated, which is the exact failure a pre-commit gate exists to prevent. (In CI it worked by
# accident: actions/checkout is shallow, so the root commit is diffed against the empty tree and
# the whole worktree gets scanned as additions. `fetch-depth: 0` would have silently removed that.)
#
# The second leg (`--no-git`) scans the files on disk. It needs this allowlist, because on any real
# operator's box it otherwise reports the LOCAL RUNTIME ARTIFACTS below — proven: 5 findings, all of
# them private keys in gitignored paths — and a gate that is red on every dev box gets ignored,
# which is worse than no gate.
[extend]
useDefault = true

[allowlist]
description = """
Gitignored, operator-local runtime artifacts. These are GENERATED by the flow (self-signed Harbor
CA/leaf keys, kubeconfigs) and are git-ignored, so they cannot reach a commit — the history leg
therefore loses no coverage by skipping them here.

This allowlist would, however, hide a DELIBERATE `git add -f`. That hole is closed mechanically, not
by trust: `make check-secrets-untracked` READS THIS LIST and fails if any tracked file matches
any pattern in it. It is DERIVED, not a restatement -- an earlier version hardcoded four of these
six paths, so `bundle/` and `.claude/worktrees/` were allowlisted-and-unchecked while this very
sentence claimed otherwise.

Add an entry here and the gate covers it, in ANY valid TOML string form -- it parses with `tomllib`,
so a double-quoted entry beside a triple-quoted one is NOT silently dropped (an earlier hand-written
parser did exactly that, which is how one edit could have reopened the hole above). Patterns are
matched with Python `re`; anything it cannot compile makes the gate DIE rather than skip the entry,
so an RE2 construct we cannot faithfully evaluate is loud instead of invisible. There is no second
list and no unstated condition.
"""
paths = [
  '''^secrets/''',      # self-signed Harbor CA + leaf keys, kubeconfigs (06-install-harbor.sh, 05-kind-up.sh)
  '''^\.jumpbox/''',    # the jump-box harness's scratch kubeconfig
  '''^\.env$''',        # the operator's own overrides (gitignored; .env.example is the committed one)
  '''^\.env\.state''',  # the discovered-state overlay (LB IPs, generated passwords)
  '''^bundle/''',       # the sneakernet image bundle (OCI layouts; binary blobs, not source)
  '''^\.claude/worktrees/''',  # harness scratch: an `isolation: "worktree"` subagent gets a FULL CHECKOUT
                        # under .claude/worktrees/<id>/, and this leg walks the FILESYSTEM, so it
                        # scans that copy too. MEASURED 2026-08-12: a read-only adversary building a
                        # throwaway 3-level PKI to test fetch-ca.sh left root/int/leaf/leaf2.key
                        # there, and `make secrets` reported "leaks found: 4" against a clean repo.
                        # Same class as trivy-config's `--skip-dirs .claude` (agents.md).
                        # ⚠️ SCOPED TO worktrees/ ON PURPOSE, not to .claude/. `.claude/hooks/` and
                        # `.claude/settings.json` ARE TRACKED (the adversary-first gate lives there),
                        # and check-secrets-untracked fails if any allowlisted path is tracked — so
                        # the broader form would break the very invariant that makes this safe.
                        # worktrees/ is gitignored and ephemeral: nothing in it can reach a commit,
                        # and the HISTORY leg covers what does.
]
